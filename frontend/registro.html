<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Analizador de Baches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Analizador de Baches</h1>

    <div class="card">
      <h2>Crear cuenta</h2>

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" placeholder="Tu nombre">

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="tu@email.com">

      <label for="password">Contraseña:</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres">

      <button onclick="registrarse()">Crear cuenta</button>

      <div id="estadoRegistro" class="estado"></div>

      <div class="auth-links">
        ¿Ya tenés cuenta? <a href="index.html">Iniciá sesión</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    redirigirSiYaHaySesion()

    async function registrarse() {
      const nombre = document.getElementById("nombre").value.trim()
      const email = document.getElementById("email").value.trim()
      const password = document.getElementById("password").value
      const estado = document.getElementById("estadoRegistro")

      if (!nombre || !email || !password) {
        estado.innerHTML = '<span class="error-msg">Completá todos los campos.</span>'
        return
      }

      estado.innerHTML = "⏳ Creando cuenta..."

      try {
        const res = await fetch(`${API_BASE}/api/auth/registro`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombre, email, password })
        })
        const data = await res.json()

        if (!res.ok) {
          estado.innerHTML = `<span class="error-msg">${data.error || "No se pudo crear la cuenta."}</span>`
          return
        }

        window.location.href = "index.html?registrado=1"
      } catch (err) {
        console.error(err)
        estado.innerHTML = '<span class="error-msg">Error de conexión con el servidor.</span>'
      }
    }
  </script>
</body>
</html>
