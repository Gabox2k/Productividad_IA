<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar Bache</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span id="topbarNombre"></span>
    <span>
      <a id="linkAdmin" href="admin.html" style="display:none;">Ver mapa (admin)</a>
      <a href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
    </span>
  </div>

  <div class="container">
    <h1>Analizador de Baches</h1>

    <div class="card">
      <h2>Analizar Bache en la Vía</h2>
      <p style="color:#666; font-size:14px; margin-top:0;">
        Subí una foto o video del bache, indicá la dirección y la IA evaluará su nivel de peligrosidad.
      </p>

      <label for="direccionBache">Dirección del bache:</label>
      <input type="text" id="direccionBache" placeholder="Calle, número, ciudad">

      <label for="archivoBache">Foto o video del bache:</label>
      <input type="file" id="archivoBache" accept="image/*,video/*">

      <button onclick="analizarBache()">Analizar Bache</button>

      <div id="estadoBache" class="estado"></div>
      <div id="resultadoBache"></div>
    </div>

    <div class="card">
      <h2>Mis Reportes</h2>
      <div id="misReportes">Cargando...</div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
